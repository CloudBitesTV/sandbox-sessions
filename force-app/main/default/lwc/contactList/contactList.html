<template>
    <lightning-card title="Related Contacts">
        <lightning-button label="New" slot="actions" onclick={handleNew}></lightning-button>
        <template for:each={records} for:item="record">
            <div key={record.Id} class="slds-p-around_medium">
                <div class="slds-text-heading_small">{record.Name.value}</div>
                <lightning-formatted-email value={record.Email.value}></lightning-formatted-email>
            </div>
        </template>
    </lightning-card>
</template>
